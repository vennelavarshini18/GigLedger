<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InvoicePilot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header><h1>InvoicePilot</h1><p>Describe the work. Get paid.</p></header>
  <main>
    <section class="card">
      <h2><span>1</span> Tell us what you did</h2>
      <textarea id="note" rows="4" placeholder="e.g. did 5 hrs of logo work for Ravi Kumar, $40/hr, he pays in 2 weeks"></textarea>
      <button id="parseBtn">Draft invoice with AI</button>
    </section>

    <section class="card hidden" id="review">
      <h2><span>2</span> Review and approve</h2>
      <div id="warnings"></div>
      <div class="grid">
        <label>Client name <input id="client_name" /></label>
        <label>Client email <input id="client_email" type="email" /></label>
        <label>Currency
          <select id="currency"><option>USD</option><option>EUR</option><option>GBP</option><option>CAD</option><option>AUD</option></select>
        </label>
        <label>Due in (days) <input id="due_in_days" type="number" min="0" /></label>
      </div>
      <div id="items"></div>
      <button class="ghost" id="addItem">+ Add line item</button>
      <label>Note to client <input id="notes" /></label>
      <p class="total">Total: <strong id="total">0.00</strong></p>
      <button id="sendBtn">Approve and send via PayPal</button>
    </section>

    <section class="card hidden" id="result"></section>
        <section class="card" id="dashboard">
      <h2 class="between">
        <span class="title">Your invoices</span>
        <button class="ghost small" id="refreshBtn" type="button">Refresh</button>
      </h2>
      <div class="stats" id="stats"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Invoice</th><th>Client</th><th>Amount</th><th>Due</th><th>Status</th><th></th></tr></thead>
          <tbody id="invoiceBody"></tbody>
        </table>
      </div>
      <p class="muted" id="listStatus"></p>
    </section>
    <p id="status" role="status"></p>
  </main>
    <dialog id="remindDialog">
    <h2 id="rmTitle"></h2>
    <p class="muted" id="rmMeta"></p>
    <label>Tone
      <select id="rmTone">
        <option value="friendly">Friendly</option>
        <option value="firm">Firm</option>
        <option value="final">Final notice</option>
      </select>
    </label>
    <p class="muted" id="rmHint"></p>
    <label>Subject <input id="rmSubject" /></label>
    <label>Message <textarea id="rmBody" rows="9"></textarea></label>
    <p id="rmMsg" role="status"></p>
    <div class="row">
      <button id="rmSend" type="button">Send PayPal reminder</button>
      <button class="ghost" id="rmMail" type="button">Email it myself</button>
      <button class="ghost" id="rmCopy" type="button">Copy</button>
      <button class="x" id="rmClose" type="button">Close</button>
    </div>
    <p class="muted">PayPal may replace the wording of its own reminder email with its standard text. To send your exact message, use "Email it myself" or Copy.</p>
  </dialog>
    <script src="invoices.js"></script>
      <script src="reminder.js"></script>
  <script src="app.js"></script>
</body>
</html>
